version: 2

seeds:
  - name: raw_steam_platform
    description: "Raw Steam platform data from Steam Spy API. Top 100 most-played games, refreshed weekly."
    columns:
      - name: appid
        description: "Steam application ID"
      - name: name
        description: "Game title"
      - name: pulled_at
        description: "Date this data was fetched from Steam Spy"

models:
  - name: stg_steam_platform
    description: >
      Staged Steam platform data. Casts types, standardizes strings,
      derives cost_per_hour. One row per game.
    columns:
      - name: appid
        description: "Steam application ID"
        tests:
          - unique
          - not_null
      - name: game_title
        tests:
          - not_null
      - name: price_usd
        description: "Purchase price in USD. 0.0 for free-to-play games."
        tests:
          - not_null
      - name: review_score
        description: "Ratio of positive to total reviews (0.0 to 1.0)"

  - name: fct_steam_platform
    description: >
      Core fact model. Platform reach, pricing, and review sentiment
      for the top 100 most-played Steam games. Refreshed weekly via
      GitHub Actions + Steam Spy API. One row per game.
    columns:
      - name: appid
        tests:
          - unique
          - not_null
      - name: price_tier
        description: "Free to Play / Budget / Mid-Range / Premium / AAA"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Free to Play', 'Budget (under $10)', 'Mid-Range ($10-$29)', 'Premium ($30-$59)', 'AAA ($60+)']
      - name: reach_tier
        description: "Ownership bucket: Mega / Huge / Large / Mid / Niche"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Mega (100M+)', 'Huge (35M+)', 'Large (15M+)', 'Mid (5M+)', 'Niche (<5M)']
      - name: review_category
        description: "Overwhelmingly Positive / Very Positive / Mostly Positive / Mixed / Mostly Negative"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Overwhelmingly Positive', 'Very Positive', 'Mostly Positive', 'Mixed', 'Mostly Negative']
      - name: owners_estimate
        description: "Midpoint of Steam Spy ownership range estimate"
        tests:
          - not_null
      - name: review_score
        description: "Ratio of positive to total reviews (0.0 to 1.0)"
